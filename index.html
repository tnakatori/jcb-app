<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>JCB利用明細</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#16233D" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #F4EFE3;
    color: #16233D;
    min-height: 100vh;
  }
  .wrap { max-width: 420px; margin: 0 auto; padding-bottom: 88px; }

  #loginScreen {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px; text-align: center;
  }
  #loginScreen h1 { font-size: 20px; margin-bottom: 4px; }
  #loginScreen p { color: #8A8172; font-size: 14px; margin-bottom: 24px; }
  #loginBtn {
    background: #16233D; color: #F4EFE3; border: none; border-radius: 999px;
    padding: 12px 28px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #loginError { color: #B0533E; font-size: 13px; margin-top: 16px; display: none; white-space: pre-wrap; }

  .header { padding: 24px 16px 0; display: flex; justify-content: space-between; align-items: center; }
  .header .eyebrow { font-size: 12px; letter-spacing: 0.02em; color: #8A8172; }
  .header h2 { font-size: 19px; font-weight: 600; margin: 2px 0 0; }
  .avatar {
    width: 36px; height: 36px; border-radius: 999px; background: #16233D; color: #C9A227;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; cursor: pointer; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .tabs { margin: 20px 16px 0; display: flex; gap: 4px; background: #EDE7D8; border-radius: 999px; padding: 4px; }
  .tabs button {
    flex: 1; padding: 8px 0; border-radius: 999px; border: none; background: none;
    font-size: 14px; font-weight: 500; color: #6B6255; cursor: pointer;
  }
  .tabs button.active { background: #16233D; color: #F4EFE3; }

  .dateNav { margin: 16px 16px 0; display: flex; align-items: center; justify-content: space-between; }
  .dateNav .arrowBtn {
    width: 32px; height: 32px; border-radius: 999px; border: none; background: none;
    display: flex; align-items: center; justify-content: center; color: #16233D; cursor: pointer; flex-shrink: 0;
  }
  .dateNav .arrowBtn:disabled { color: #C9C2AE; cursor: default; }
  .dateNav .arrowBtn:not(:disabled):active { background: #EDE7D8; }
  .dateLabelWrap { position: relative; flex: 1; margin: 0 8px; }
  .dateLabelWrap .labelBox {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 14px; font-weight: 500; color: #16233D;
    border: 1px solid #E7E0CC; border-radius: 999px; padding: 6px 0; background: #fff;
  }
  .dateLabelWrap input[type="date"], .dateLabelWrap select {
    position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
  }

  .totalCard {
    margin: 16px 16px 0; background: #FBF9F3; border: 1px solid #E7E0CC;
    border-radius: 24px; padding: 20px 20px 16px;
  }
  .totalCard .sub { font-size: 13px; color: #8A8172; }
  .totalAmount { font-size: 32px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; margin-top: 4px; }
  canvas#periodChart { margin-top: 12px; max-height: 110px; width: 100% !important; }

  .sectionLabel { font-size: 13px; color: #8A8172; margin: 20px 16px 8px; }
  .card { margin: 0 16px; background: #FBF9F3; border: 1px solid #E7E0CC; border-radius: 16px; padding: 16px; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  .rowIcon { width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .rowBody { flex: 1; min-width: 0; }
  .rowTop { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; gap: 8px; }
  .rowTop .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rowTop .amt { font-weight: 500; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .track { height: 6px; border-radius: 999px; background: #EDE7D8; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; }

  .catSelectWrap { margin-left: 44px; margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .catSelectWrap span { font-size: 11px; color: #8A8172; }
  .catSelectWrap select { font-size: 12px; border: 1px solid #E7E0CC; border-radius: 999px; padding: 3px 8px; background: #fff; color: #16233D; }

  .txCard { margin: 0 16px; background: #FBF9F3; border: 1px solid #E7E0CC; border-radius: 16px; overflow: hidden; }
  .txRow { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #EDE7D8; }
  .txRow:last-child { border-bottom: none; }
  .txIcon { width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .txBody { flex: 1; min-width: 0; }
  .txMerchant { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .txDate { font-size: 12px; color: #8A8172; }
  .txAmount { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }

  .empty { text-align: center; padding: 32px 20px; color: #8A8172; font-size: 14px; }
  .loading { text-align: center; padding: 60px 20px; color: #8A8172; font-size: 14px; }

  .bottomNav {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center;
    z-index: 10;
  }
  .bottomNav .inner {
    width: 100%; max-width: 420px; background: #FBF9F3; opacity: 1;
    border-top: 1px solid #E7E0CC; display: flex;
    box-shadow: 0 -4px 16px rgba(22,35,61,0.08);
  }
  .bottomNav button {
    flex: 1; border: none; background: none; display: flex; flex-direction: column;
    align-items: center; gap: 2px; padding: 10px 0 12px; font-size: 11px; color: #B4AC9A; cursor: pointer;
  }
  .bottomNav button.active { color: #16233D; }
  .bottomNav svg { width: 18px; height: 18px; }

  .page { display: none; }
  .page.active { display: block; }
</style>
</head>
<body>

<div id="loginScreen">
  <h1>JCB利用明細</h1>
  <p>ご本人のGoogleアカウントでログインしてください</p>
  <button id="loginBtn">Googleでログイン</button>
  <p id="loginError"></p>
</div>

<div id="app" class="wrap" style="display:none;">
  <div class="header">
    <div>
      <p class="eyebrow">ANA JCB CARD FIRST</p>
      <h2 id="pageTitle">利用明細</h2>
    </div>
    <div class="avatar" id="avatar"></div>
  </div>

  <div class="tabs" id="tabs">
    <button data-period="day">日</button>
    <button data-period="week" class="active">週</button>
    <button data-period="month">月</button>
  </div>

  <div class="dateNav">
    <button class="arrowBtn" id="prevBtn" aria-label="前へ">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="dateLabelWrap">
      <div class="labelBox">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8A8172" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span id="periodLabel"></span>
      </div>
      <input type="date" id="dayPicker" style="display:none;" />
      <select id="periodPicker" style="display:none;"></select>
    </div>
    <button class="arrowBtn" id="nextBtn" aria-label="次へ">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <div class="page active" id="homePage">
    <div class="totalCard">
      <p class="sub">合計金額</p>
      <p class="totalAmount" id="totalAmount">¥0</p>
      <canvas id="periodChart" height="100"></canvas>
    </div>

    <p class="sectionLabel" id="historyLabel">利用履歴</p>
    <div class="txCard" id="txCard"></div>
  </div>

  <div class="page" id="breakdownPage">
    <div id="recurringSection" style="display:none;">
      <p class="sectionLabel">定期支払い(推定)</p>
      <div class="card" id="recurringCard"></div>
    </div>

    <p class="sectionLabel">カテゴリ別</p>
    <div class="card" id="catCard"></div>

    <p class="sectionLabel">支払い先別</p>
    <div class="card" id="merchantCard"></div>
  </div>
</div>

<div id="loadingScreen" class="loading" style="display:none;">読み込み中...</div>

<div class="bottomNav" id="bottomNav" style="display:none;">
  <div class="inner">
    <button class="active" data-page="homePage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
      ホーム
    </button>
    <button data-page="breakdownPage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 3"/></svg>
      内訳
    </button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, onSnapshot, doc, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAO4QfWy5rEy_O860RoLbhYJ-scmKfIhOA",
  authDomain: "jcb-card-8f92f.firebaseapp.com",
  projectId: "jcb-card-8f92f",
  storageBucket: "jcb-card-8f92f.firebasestorage.app",
  messagingSenderId: "894726627206",
  appId: "1:894726627206:web:28507b3e3b38c24b675607",
};

const CATEGORY_RULES = [
  { key: "cafe",    label: "カフェ",   icon: "☕", color: "#B5651D", words: ["スターバックス","ドトール","タリーズ","コーヒー","カフェ","メルモ"] },
  { key: "food",    label: "食料品",   icon: "🛒", color: "#C9A227", words: ["セブン","ローソン","ファミリーマート","イオン","スーパー","西友","マルエツ"] },
  { key: "dine",    label: "飲食",     icon: "🍽", color: "#8A9A5B", words: ["食堂","レストラン","そば","うどん","ラーメン","定食"] },
  { key: "transit", label: "交通",     icon: "🚃", color: "#5B7C99", words: ["JR","メトロ","鉄道","バス","タクシー"] },
  { key: "sub",     label: "サブスク", icon: "🎬", color: "#7A6FB0", words: ["Netflix","Spotify","Amazon Prime","Apple","Google"] },
  { key: "util",    label: "公共料金", icon: "⚡", color: "#B0533E", words: ["電力","ガス","水道"] },
];
const OTHER = { key: "other", label: "その他", icon: "🧾", color: "#8A8172", words: [] };
const ALL_CATS = [...CATEGORY_RULES, OTHER];

let categoryOverrides = {};

function categorize(merchant) {
  if (categoryOverrides[merchant]) {
    return ALL_CATS.find(c => c.key === categoryOverrides[merchant]) || OTHER;
  }
  return CATEGORY_RULES.find(r => r.words.some(w => merchant.includes(w))) || OTHER;
}
function yen(n) { return "¥" + Math.round(n).toLocaleString("ja-JP"); }

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

document.getElementById("loginBtn").addEventListener("click", () => {
  signInWithPopup(auth, provider).catch((err) => showFatalError("ログインエラー: " + err.code + " " + err.message));
});
document.getElementById("avatar").addEventListener("click", () => {
  if (confirm("ログアウトしますか？")) signOut(auth);
});

function showFatalError(msg) {
  const el = document.getElementById("loginError");
  el.textContent = msg;
  el.style.display = "block";
  console.error(msg);
}
window.addEventListener("error", (e) => showFatalError("スクリプトエラー: " + e.message));

let allTx = [];
let period = "week";
let offset = 0;
let chart = null;
let page = "homePage";

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("bottomNav").style.display = "flex";
    const avatar = document.getElementById("avatar");
    avatar.innerHTML = user.photoURL ? `<img src="${user.photoURL}" alt="">` : (user.displayName||"?").slice(0,2);
    listenToTransactions();
    listenToOverrides();
  } else {
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("app").style.display = "none";
    document.getElementById("bottomNav").style.display = "none";
  }
});

function listenToTransactions() {
  document.getElementById("loadingScreen").style.display = "block";
  onSnapshot(collection(db, "transactions"), (snap) => {
    allTx = [];
    snap.forEach((d) => {
      const v = d.data();
      const m = (v.usedAt || "").match(/(\d{4})\/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2})/);
      if (!m) return;
      allTx.push({
        id: d.id,
        date: new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5]),
        amount: Number(v.amount) || 0,
        merchant: v.merchant || "不明",
      });
    });
    document.getElementById("loadingScreen").style.display = "none";
    render();
  }, (err) => {
    document.getElementById("loadingScreen").textContent = "データの読み込みに失敗しました: " + err.message;
  });
}

function listenToOverrides() {
  onSnapshot(collection(db, "categoryOverrides"), (snap) => {
    categoryOverrides = {};
    snap.forEach((d) => { categoryOverrides[d.id] = d.data().category; });
    render();
  });
}

async function assignCategory(merchant, catKey) {
  categoryOverrides[merchant] = catKey;
  render();
  try {
    await setDoc(doc(db, "categoryOverrides", merchant), { category: catKey, updatedAt: new Date().toISOString() });
  } catch (e) {
    showFatalError("カテゴリの保存に失敗しました: " + e.message);
  }
}

function startOfDay(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function startOfWeek(d) { const x = startOfDay(d); const day = (x.getDay()+6)%7; return addDays(x, -day); }
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
const WEEK_LABELS = ["月","火","水","木","金","土","日"];
const MONTH_LABELS = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

function getDayView(off) {
  const day = addDays(startOfDay(new Date()), -off);
  const nextDay = addDays(day, 1);
  const tx = allTx.filter(t => t.date >= day && t.date < nextDay);
  const label = `${day.getFullYear()}年${day.getMonth()+1}月${day.getDate()}日` + (off===0?"（今日）":off===1?"（昨日）":"");
  const chartData = Array.from({length: 24}, (_, h) => ({
    label: `${h}時`, value: tx.filter(t => t.date.getHours()===h).reduce((s,t)=>s+t.amount,0)
  }));
  return { label, total: tx.reduce((s,t)=>s+t.amount,0), tx, chartData, chartType: "line" };
}
function getWeekView(off) {
  const start = addDays(startOfWeek(new Date()), -off*7);
  const end = addDays(start, 7);
  const tx = allTx.filter(t => t.date >= start && t.date < end);
  const chartData = WEEK_LABELS.map((label, i) => {
    const dS = addDays(start, i), dE = addDays(dS, 1);
    return { label, value: allTx.filter(t => t.date>=dS && t.date<dE).reduce((s,t)=>s+t.amount,0) };
  });
  const label = `${start.getMonth()+1}/${start.getDate()} 〜 ${addDays(end,-1).getMonth()+1}/${addDays(end,-1).getDate()}` + (off===0?"（今週）":"");
  return { label, total: tx.reduce((s,t)=>s+t.amount,0), tx, chartData, chartType: "bar" };
}
function getMonthView(off) {
  const base = startOfMonth(new Date());
  const target = new Date(base.getFullYear(), base.getMonth()-off, 1);
  const nextMonth = new Date(target.getFullYear(), target.getMonth()+1, 1);
  const tx = allTx.filter(t => t.date >= target && t.date < nextMonth);
  const chartData = MONTH_LABELS.map((label, i) => {
    const mS = new Date(target.getFullYear(), i, 1), mE = new Date(target.getFullYear(), i+1, 1);
    return { label, value: allTx.filter(t => t.date>=mS && t.date<mE).reduce((s,t)=>s+t.amount,0), highlighted: i===target.getMonth() };
  });
  const label = `${target.getFullYear()}年${target.getMonth()+1}月` + (off===0?"（今月）":"");
  return { label, total: tx.reduce((s,t)=>s+t.amount,0), tx, chartData, chartType: "bar" };
}
const VIEW_FNS = { day: getDayView, week: getWeekView, month: getMonthView };

function detectRecurring() {
  const byMerchant = {};
  allTx.forEach(t => { (byMerchant[t.merchant] ||= []).push(t); });
  const results = [];
  Object.entries(byMerchant).forEach(([merchant, list]) => {
    if (list.length < 2) return;
    const months = new Set(list.map(t => `${t.date.getFullYear()}-${t.date.getMonth()}`));
    if (months.size < 2) return;
    const amounts = list.map(t => t.amount);
    const avg = amounts.reduce((s,a)=>s+a,0)/amounts.length;
    const maxDiff = Math.max(...amounts.map(a => Math.abs(a-avg)/avg));
    if (maxDiff <= 0.15) results.push({ merchant, avg, count: list.length });
  });
  return results.sort((a,b)=>b.count-a.count);
}

document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-period]");
  if (!btn) return;
  period = btn.dataset.period;
  offset = 0;
  [...document.querySelectorAll("#tabs button")].forEach(b => b.classList.toggle("active", b===btn));
  render();
});

document.getElementById("bottomNav").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-page]");
  if (!btn) return;
  page = btn.dataset.page;
  document.getElementById("pageTitle").textContent = page === "homePage" ? "利用明細" : "内訳";
  [...document.querySelectorAll(".bottomNav button")].forEach(b => b.classList.toggle("active", b===btn));
  [...document.querySelectorAll(".page")].forEach(p => p.classList.toggle("active", p.id===page));
});

document.getElementById("prevBtn").addEventListener("click", () => { offset++; render(); });
document.getElementById("nextBtn").addEventListener("click", () => { if (offset>0) { offset--; render(); } });

document.getElementById("dayPicker").addEventListener("change", (e) => {
  if (!e.target.value) return;
  const picked = new Date(e.target.value + "T00:00:00");
  offset = Math.max(0, Math.round((startOfDay(new Date()) - picked) / 86400000));
  render();
});
document.getElementById("periodPicker").addEventListener("change", (e) => {
  offset = Number(e.target.value);
  render();
});

function updateDateNav() {
  const dayPicker = document.getElementById("dayPicker");
  const periodPicker = document.getElementById("periodPicker");
  dayPicker.style.display = period === "day" ? "block" : "none";
  periodPicker.style.display = period === "day" ? "none" : "block";

  if (period === "day") {
    const d = addDays(startOfDay(new Date()), -offset);
    dayPicker.value = d.toISOString().slice(0,10);
    dayPicker.max = new Date().toISOString().slice(0,10);
  } else {
    const n = period === "week" ? 26 : 24;
    const fn = period === "week" ? getWeekView : getMonthView;
    periodPicker.innerHTML = "";
    for (let i = 0; i < n; i++) {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = fn(i).label;
      if (i === offset) opt.selected = true;
      periodPicker.appendChild(opt);
    }
  }
  document.getElementById("nextBtn").disabled = offset === 0;
}

function render() {
  updateDateNav();

  if (allTx.length === 0) {
    document.getElementById("periodLabel").textContent = "";
    document.getElementById("totalAmount").textContent = yen(0);
    document.getElementById("txCard").innerHTML = '<div class="empty">JCBの利用があると自動で表示されます</div>';
    document.getElementById("catCard").innerHTML = '<div class="empty">データがまだありません</div>';
    document.getElementById("merchantCard").innerHTML = '<div class="empty">データがまだありません</div>';
    document.getElementById("recurringSection").style.display = "none";
    if (chart) { chart.destroy(); chart = null; }
    return;
  }

  const view = VIEW_FNS[period](offset);
  document.getElementById("periodLabel").textContent = view.label;
  document.getElementById("totalAmount").textContent = yen(view.total);
  document.getElementById("historyLabel").textContent =
    period === "day" ? "この日の利用履歴" : period === "week" ? "この週の利用履歴" : "この月の利用履歴";

  renderChart(view);
  renderHistory(view);
  renderBreakdown(view);
}

function renderChart(view) {
  const ctx = document.getElementById("periodChart").getContext("2d");
  if (chart) chart.destroy();

  const isLine = view.chartType === "line";
  chart = new Chart(ctx, {
    type: isLine ? "line" : "bar",
    data: {
      labels: view.chartData.map(d => d.label),
      datasets: [{
        data: view.chartData.map(d => d.value),
        borderColor: "#C9A227",
        backgroundColor: isLine ? "rgba(201,162,39,0.15)"
          : view.chartData.map(d => d.highlighted ? "#C9A227" : "#16233D"),
        fill: isLine,
        tension: 0.3,
        pointRadius: isLine ? 2 : 0,
        pointBackgroundColor: "#C9A227",
        borderWidth: isLine ? 2 : 0,
        borderRadius: isLine ? 0 : 6,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          displayColors: false,
          callbacks: {
            title: (items) => items[0].label,
            label: (item) => yen(item.raw),
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: {
            font: { size: 10 }, color: "#8A8172",
            autoSkip: true, maxTicksLimit: period === "day" ? 8 : (period === "month" ? 12 : 7),
          }
        },
        y: { display: false }
      }
    }
  });
}

function renderHistory(view) {
  const txCard = document.getElementById("txCard");
  const list = view.tx.slice().sort((a,b)=>b.date-a.date);
  if (list.length === 0) {
    txCard.innerHTML = '<div class="empty">この期間の利用はありません</div>';
    return;
  }
  txCard.innerHTML = list.map(t => {
    const meta = categorize(t.merchant);
    const d = t.date;
    const dateStr = period === "day"
      ? `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`
      : `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    return `
      <div class="txRow">
        <div class="txIcon" style="background:${meta.color}22;">${meta.icon}</div>
        <div class="txBody">
          <div class="txMerchant">${t.merchant}</div>
          <div class="txDate">${dateStr}</div>
        </div>
        <div class="txAmount">${yen(t.amount)}</div>
      </div>`;
  }).join("");
}

function renderBreakdown(view) {
  const catTotals = {}, merchantTotals = {};
  view.tx.forEach(t => {
    const cat = categorize(t.merchant);
    catTotals[cat.key] = (catTotals[cat.key]||0) + t.amount;
    merchantTotals[t.merchant] = (merchantTotals[t.merchant]||0) + t.amount;
  });

  const catCard = document.getElementById("catCard");
  const catEntries = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  if (catEntries.length === 0) {
    catCard.innerHTML = '<div class="empty">この期間の利用はありません</div>';
  } else {
    const max = catEntries[0][1];
    catCard.innerHTML = catEntries.map(([key, amount]) => {
      const meta = ALL_CATS.find(c=>c.key===key);
      return `
        <div class="row">
          <div class="rowIcon" style="background:${meta.color}22;">${meta.icon}</div>
          <div class="rowBody">
            <div class="rowTop"><span class="name">${meta.label}</span><span class="amt">${yen(amount)}</span></div>
            <div class="track"><div class="fill" style="width:${(amount/max)*100}%;background:${meta.color}"></div></div>
          </div>
        </div>`;
    }).join("");
  }

  const merchantCard = document.getElementById("merchantCard");
  const merchantEntries = Object.entries(merchantTotals).sort((a,b)=>b[1]-a[1]);
  if (merchantEntries.length === 0) {
    merchantCard.innerHTML = '<div class="empty">この期間の利用はありません</div>';
  } else {
    const maxM = merchantEntries[0][1];
    merchantCard.innerHTML = merchantEntries.map(([name, amount]) => {
      const meta = categorize(name);
      const count = view.tx.filter(t=>t.merchant===name).length;
      const isUncategorized = !categoryOverrides[name] && meta.key === "other";
      const safeName = name.replace(/"/g, "&quot;");
      const selectHtml = isUncategorized ? `
        <div class="catSelectWrap">
          <span>カテゴリ未設定:</span>
          <select data-merchant="${safeName}" class="catAssignSelect">
            <option value="">選択する</option>
            ${CATEGORY_RULES.map(c => `<option value="${c.key}">${c.label}</option>`).join("")}
          </select>
        </div>` : "";
      return `
        <div class="row" style="flex-direction:column; align-items:stretch;">
          <div style="display:flex; align-items:center; gap:12px;">
            <div class="rowIcon" style="background:${meta.color}22;">${meta.icon}</div>
            <div class="rowBody">
              <div class="rowTop"><span class="name">${name}${count>1?`（${count}回）`:""}</span><span class="amt">${yen(amount)}</span></div>
              <div class="track"><div class="fill" style="width:${(amount/maxM)*100}%;background:${meta.color}"></div></div>
            </div>
          </div>
          ${selectHtml}
        </div>`;
    }).join("");

    merchantCard.querySelectorAll(".catAssignSelect").forEach(sel => {
      sel.addEventListener("change", (e) => {
        if (!e.target.value) return;
        assignCategory(e.target.dataset.merchant, e.target.value);
      });
    });
  }

  const recurring = detectRecurring();
  const recurringSection = document.getElementById("recurringSection");
  if (recurring.length === 0) {
    recurringSection.style.display = "none";
  } else {
    recurringSection.style.display = "block";
    document.getElementById("recurringCard").innerHTML = recurring.map(r => {
      const meta = categorize(r.merchant);
      return `
        <div class="row">
          <div class="rowIcon" style="background:${meta.color}22;">${meta.icon}</div>
          <div class="rowBody" style="display:flex; align-items:center; justify-content:space-between;">
            <div>
              <div style="font-size:13px;">${r.merchant}</div>
              <div style="font-size:11px; color:#8A8172;">過去${r.count}回・毎月ほぼ同額</div>
            </div>
            <div style="font-size:13px; font-weight:500;">約${yen(r.avg)}/月</div>
          </div>
        </div>`;
    }).join("");
  }
}
</script>
</body>
</html>
